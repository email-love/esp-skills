name: Release skills

# Publishing is deliberate: a pushed v* tag, or a manual dispatch.
# The build job runs read-only; only the publish job is given write access.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python3 -m pip install pyyaml==6.0.2

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Check shared blocks are in sync
        run: python3 scripts/sync_shared.py --check

      - name: Build .skill archives
        run: bash scripts/build.sh

      - name: Verify archives
        run: bash scripts/verify_dist.sh

      - name: Confirm the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "tag v$tag does not match VERSION ($file)" >&2
            exit 1
          fi
          echo "tag v$tag matches VERSION"

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-archives
          path: |
            dist/*.skill
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-archives
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            dist/*.skill
            dist/SHA256SUMS
          fail_on_unmatched_files: true
